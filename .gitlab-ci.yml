stages:
  - test
  - package
  - containerize
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml

default:
  image: eclipse-temurin:17-jdk-jammy
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository

variables:
  MAVEN_CLI_OPTS: "-B -ntp"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  LATEST_TAG: "$CI_REGISTRY_IMAGE:latest"

sast:
  stage: test

maven_test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

package_app:
  stage: package
  image: maven:3.9.9-eclipse-temurin-17
  needs:
    - maven_test
  script:
    - mvn $MAVEN_CLI_OPTS -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" package -DskipTests
  artifacts:
    paths:
      - target/dockerdemo.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

docker_build:
  stage: containerize
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  needs:
    - job: package_app
      artifacts: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
    - docker push "$IMAGE_TAG"
    - docker push "$LATEST_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - docker_build
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' '$CI_REGISTRY' &&
      docker pull '$IMAGE_TAG' &&
      docker stop dockerdemo || true &&
      docker rm dockerdemo || true &&
      docker run -d --name dockerdemo -p 8080:8080 '$IMAGE_TAG'"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST && $DEPLOY_USER && $SSH_PRIVATE_KEY
      when: manual
    - when: never
